name: CICD #workflow name
on:
  workflow_dispatch:
    inputs:
      environment:
        description: This is the environment value where workflow runs
        default: 'dev'
        required: true
        type: choice
        options:
          - dev
          - prod
          - stging
          
jobs:

  code: #jobs name
    runs-on: ubuntu-latest  #runner - every job has seperate runner- also called as parallel scalling
    steps:
      - name: checkout the code
        run: echo "get/clone the code from Git"
        
  build:
    needs: [code]
    runs-on: ubuntu-latest
    steps:
      - name: build the code
        run: echo "build the container/code"
        
  test:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: test the code
        run: echo "test the container/code"
        
  deploy:
    if: inputs.environment == 'dev'
    needs: [build, test]
    runs-on: ubuntu-latest
    steps:
      - name: deploy the app
        run:  echo "application deployment successful"
